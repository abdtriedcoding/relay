<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay Widget Demo</title>
    <style>
      body {
        font-family: 'DM Sans', 'Segoe UI', sans-serif;
        padding: 40px 20px;
        background: #f3f5f2;
        color: #12262e;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #fbfcfa;
        padding: 40px;
        border-top: 3px solid #ffc94a;
        box-shadow: 0 6px 20px rgba(14, 34, 41, 0.08);
      }
      h1,
      h2,
      h3 {
        font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        letter-spacing: -0.03em;
      }
      h1 {
        margin-top: 0;
        font-size: 2.25rem;
      }
      .controls {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .controls button {
        padding: 11px 20px;
        border: none;
        border-radius: 3px;
        background: #0e2229;
        color: #f3f5f2;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      .controls button:hover {
        background: #1b3941;
      }
      pre {
        background: #0e2229;
        color: #d9e4e0;
        padding: 18px;
        border-radius: 4px;
        overflow-x: auto;
      }
      .config-form {
        margin-top: 20px;
        padding: 20px;
        background: #e7ede9;
        border-radius: 4px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Relay Widget Demo</h1>
      <p>
        This page demonstrates how to embed the Relay support widget on your
        website.
      </p>

      <h2>Basic Usage</h2>
      <pre><code>&lt;script src="https://your-domain.com/widget.js" 
        data-org-id="<span id="example-org-id">org_30FZE66GsG2nfP9SiCWwNQv4h1z</span>"&gt;
&lt;/script&gt;</code></pre>

      <div class="config-form">
        <h3>Configuration</h3>
        <div class="form-group">
          <label for="orgId">Organization ID:</label>
          <input
            type="text"
            id="orgId"
            placeholder="Enter your organization ID"
            value=""
          />
        </div>
        <div class="form-group">
          <label for="position">Position:</label>
          <select id="position">
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
          </select>
        </div>
      </div>

      <div class="controls">
        <button onclick="initWidget()">Initialize Widget</button>
        <button onclick="showWidget()">Show Widget</button>
        <button onclick="hideWidget()">Hide Widget</button>
        <button onclick="destroyWidget()">Destroy Widget</button>
      </div>
    </div>

    <!-- Load the widget with default config -->
    <script
      type="module"
      src="./embed.ts"
      data-org-id="org_30xn5Nyuxj5EcWZqyTnOB7DbGq2"
    ></script>

    <script type="module">
      import { EMBED_CONFIG } from './config.ts';

      // Set display values on load
      document.getElementById('example-org-id').textContent =
        EMBED_CONFIG.DEFAULT_ORG_ID;
      document.getElementById('orgId').value = EMBED_CONFIG.DEFAULT_ORG_ID;

      window.initWidget = function () {
        const config = {
          orgId:
            document.getElementById('orgId').value ||
            EMBED_CONFIG.DEFAULT_ORG_ID,
          position: document.getElementById('position').value
        };

        if (window.RelayWidget) {
          window.RelayWidget.init(config);
          console.log('Widget reinitialized with config:', config);
        }
      };

      window.showWidget = function () {
        if (window.RelayWidget) {
          window.RelayWidget.show();
        } else {
          alert('Please initialize the widget first');
        }
      };

      window.hideWidget = function () {
        if (window.RelayWidget) {
          window.RelayWidget.hide();
        }
      };

      window.destroyWidget = function () {
        if (window.RelayWidget) {
          window.RelayWidget.destroy();
          console.log('Widget destroyed');
        }
      };
    </script>
  </body>
</html>
